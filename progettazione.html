<style>
/* PORTALE NEXT 2.0-143 — pagina Progettazione (pagine_html 'progettazione', pubblicata come area-lavoro/progettazione.html).

html,body{margin:0;background:#0B1119}
*{box-sizing:border-box}
[data-tema]{--sf:#FFFFFF;--sf2:#F6F8FA;--ink:#0F172A;--ink2:#334155;--ink3:#64748B;--ln:#E3E7EC;--acw:#E0F4F9;--rdw:#FEE2E2;--grw:#DCFCE7;--amw:#FEF3C7;--viw:#F0ECFE;--ac:#0891B2;--gr:#15803D;--rd:#B91C1C;--am:#B45309;--vi:#7C3AED;--blu:#1E3A5F}

button,input,select,textarea{font-family:inherit}
nav.menu{flex:0 0 224px;background:#0B1119;padding:14px 10px;display:flex;flex-direction:column;gap:1px;font-family:'IBM Plex Sans',Arial,sans-serif;position:sticky;top:0;height:100vh;align-self:flex-start;overflow-y:auto}

.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#22D3EE,#0891B2);display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#0E141D;font-style:normal}
.logo span{display:flex;flex-direction:column;color:#E6EDF5}.logo b{font-size:13.5px}.logo small{font-size:10.5px;color:#8D9BAD}

.mv.su{color:#22D3EE;background:rgba(34,211,238,.12)}
.mg{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#5F6E81;font-weight:800;padding:12px 10px 4px}

h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em}

.fl{font:700 12px Manrope,sans-serif;height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);color:var(--ink2);cursor:pointer;white-space:nowrap}

.lbl{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.avviso{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);font-size:13px;line-height:1.45;color:var(--ink2)}

.filtri{display:flex;gap:6px;flex-wrap:wrap}
.righe{display:flex;flex-direction:column;gap:2px;overflow-y:auto;margin:0 -4px;padding:0 4px;min-height:120px}
.riga{display:flex;flex-direction:column;gap:3px;padding:9px 10px;border-radius:10px;border:1px solid transparent;background:none;cursor:pointer;text-align:left;color:var(--ink);width:100%}
.riga:hover{background:var(--sf2)}
.riga.su{background:var(--acw);border-color:#0891B2}
.riga .r1{display:flex;align-items:center;gap:6px;min-width:0}
.riga .r1 b{font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.riga .r1 .kw{font:600 12px 'IBM Plex Mono',monospace;color:var(--ink2)}
.riga .r2{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink3);flex-wrap:wrap}
.ok{color:var(--gr);background:var(--grw)}.no{color:var(--rd);background:var(--rdw)}.tp{color:var(--vi);background:var(--viw)}
.contatore{font-size:11.5px;color:var(--ink3);padding:2px 4px}
/* scheda */
.scheda{display:flex;flex-direction:column;gap:16px;min-width:0}
.testa-scheda{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.testa-scheda .nm{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.testa-scheda h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.testa-scheda .sub{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink3)}
.dati{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.blocco{border:1px solid var(--ln);border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:7px;min-width:0;background:var(--sf)}
.blocco h4{margin:0;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);display:flex;gap:6px;align-items:center}
.blocco .tit{font-size:14px;font-weight:700;line-height:1.3}
.blocco .tit small{display:block;font:500 11.5px 'IBM Plex Mono',monospace;color:var(--ink3);margin-top:2px}
.kv{display:grid;grid-template-columns:auto 1fr;column-gap:10px;row-gap:3px;font-size:12.5px}
.kv dt{color:var(--ink3)}
.kv dd{margin:0;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink);text-align:right;overflow-wrap:anywhere}
.kv dd.manca{color:var(--rd);font-family:Manrope,sans-serif;font-weight:700}
.blocco a{color:var(--ac);font-weight:700;font-size:12.5px;text-decoration:none}
.blocco .nota-p{font-size:11.5px;color:var(--ink3)}
.blocco a:hover{text-decoration:underline}
/* configura */
.conf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.campo{display:flex;flex-direction:column;gap:6px;min-width:0}
.campo.largo{grid-column:1/-1}
.scelte{display:flex;gap:6px;flex-wrap:wrap}
.sc{font:700 12.5px Manrope,sans-serif;min-height:34px;padding:5px 12px;border-radius:9px;border:1px solid var(--ln);background:var(--sf);color:var(--ink2);cursor:pointer;display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;text-align:left}
.sc small{font-weight:600;font-size:10.5px;color:var(--ink3)}
.sc.su{border-color:#0891B2;background:var(--acw);color:var(--ac)}
.sc.su small{color:var(--ac)}
input.num,select.sel,textarea.nota{border:1px solid var(--ln);border-radius:9px;background:var(--sf);color:var(--ink);font:500 13px 'IBM Plex Sans',sans-serif;padding:0 10px;height:34px}
input.num{width:90px;font-family:'IBM Plex Mono',monospace}
textarea.nota{height:70px;padding:8px 10px;resize:vertical;width:100%;line-height:1.45}
.spunta{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink2);cursor:pointer;line-height:1.4}
.spunta input{margin-top:2px;accent-color:#0891B2}
.mppt{display:flex;flex-direction:column;gap:8px;border:1px dashed var(--ln);border-radius:12px;padding:10px 12px}
.mppt-riga{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mppt-riga .nm{font:800 12px 'IBM Plex Mono',monospace;color:var(--blu);min-width:58px}
.str{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);border:1px solid var(--ln);border-radius:9px;padding:3px 6px 3px 9px;background:var(--sf2)}
.str input{width:52px;height:28px;border:1px solid var(--ln);border-radius:7px;background:var(--sf);color:var(--ink);font:600 13px 'IBM Plex Mono',monospace;text-align:center}
.str select{height:28px;border:1px solid var(--ln);border-radius:7px;background:var(--sf);color:var(--ink);font:600 11.5px Manrope,sans-serif}
.str .x{border:0;background:none;color:var(--ink3);cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
.str .v{font:600 11px 'IBM Plex Mono',monospace;color:var(--ink3)}
.str .v.alto{color:var(--rd)}
.somma{font-size:12.5px;color:var(--ink2)}
.somma b{font-family:'IBM Plex Mono',monospace}
.piede-conf{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--ln);padding-top:12px}
.piede-conf .msg{font-size:13px;color:var(--ink2);flex:1;min-width:200px}
.piede-conf .msg.err{color:var(--rd);font-weight:700}
/* revisioni */
.attesa{display:flex;align-items:center;gap:14px;background:#0B1119;color:#E6EDF5;border-radius:14px;padding:13px 16px;font-family:'IBM Plex Sans',Arial,sans-serif}

.attesa .ruota{flex:0 0 26px;width:26px;height:26px;border-radius:50%;border:3px solid rgba(34,211,238,.25);border-top-color:#22D3EE;animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.attesa .cx{flex:1;display:flex;flex-direction:column;gap:2px}
.attesa b{font-size:14px}.attesa small{color:#A3B1C2;font-size:12px}
.attesa .ab{font:700 12.5px Manrope,sans-serif;border:1px solid #31435F;border-radius:9px;height:32px;padding:0 12px;background:transparent;color:#C9D3DF;cursor:pointer}
.rev{border:1px solid var(--ln);border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:9px}
.rev.prima{border-color:#0891B2;box-shadow:0 0 0 3px var(--acw)}
.rev .r1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rev .r1 .n{font:800 15px 'IBM Plex Mono',monospace;color:var(--blu)}
.rev .r1 .q{font-size:12px;color:var(--ink3)}
.rev .r1 .bb{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tavole{display:flex;gap:6px;flex-wrap:wrap}
.tavola{display:inline-flex;align-items:center;gap:6px;font:600 12px Manrope,sans-serif;height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--ln);background:var(--sf2);color:var(--ink2);text-decoration:none}
.tavola:hover{border-color:var(--ac);color:var(--ac)}
.tavola .mono{font-size:10.5px;color:var(--ink3)}
.barra-tel{display:none}
.porta{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:#0B1119;font-family:'IBM Plex Sans',Arial,sans-serif}
.porta .box{width:100%;max-width:380px;background:#121B27;border:1px solid #1F2B3A;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px;color:#E6EDF5}
.porta h2{margin:0;font:800 19px Manrope,sans-serif}
.porta p{margin:0;font-size:13px;line-height:1.5;color:#A3B1C2}
.porta input{height:44px;border-radius:10px;border:1px solid #2A3A50;background:#0B1119;color:#E6EDF5;padding:0 12px;font:500 15px 'IBM Plex Sans',sans-serif}
.porta .err{color:#F87171;font-size:12.5px;min-height:16px}
.nascosto{display:none!important}
@media (max-width:1280px){ .dati{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:1050px){
 .lavoro{grid-template-columns:1fr}
 .elenco{position:static;max-height:none}
 .righe{max-height:46vh}
 .conf{grid-template-columns:1fr}
}
@media (max-width:760px){
 nav.menu{display:none}

 .barra-tel{display:flex;position:sticky;top:0;z-index:20;align-items:center;gap:10px;padding:10px 16px;background:#0B1119;color:#E6EDF5;font-family:'IBM Plex Sans',Arial,sans-serif}
 .barra-tel i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#22D3EE,#0891B2);display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#0E141D;font-style:normal}
 .barra-tel b{font-size:14px}.barra-tel small{color:#8D9BAD;font-size:11px;display:block}
 .barra-tel .bt{width:34px;height:34px;border-radius:9px;border:1px solid #1F2B3A;background:transparent;color:#A3B1C2;display:flex;align-items:center;justify-content:center}
 .barra-tel .bt:first-of-type{margin-left:auto}
 .app{flex-direction:column;background:var(--sf2)}
 main{padding:14px 16px 28px;gap:14px}
 h1{font-size:21px}
 header.testa .dx{display:none}
 .dati{grid-template-columns:1fr}
 .card{padding:14px 14px 12px}
 .rev .r1 .bb{margin-left:0;width:100%}
}
@media print{ nav.menu,.barra-tel,.elenco,.dx,#cardConf,.attesa{display:none!important} .app{background:#fff} main{padding:0} }
</style>

/* ---------- accesso: lo stesso lasciapassare di Marketing e dell'Area di lavoro (regia_pass), dato da regia-entra ---------- */

    PASS = sessionStorage.getItem('regia_pass'); CHI = sessionStorage.getItem('regia_chi');

}

  radice.innerHTML = '<div class="porta"><form class="box" id="f-porta" autocomplete="off">' +
    '<div class="logo" style="padding:0"><i>N</i><span><b>Next S.r.l.</b><small>portale gestione · Progettazione</small></span></div>' +

    fetch(API + 'regia-entra', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ parola: p }) })

function carica() {

/* ---------- elenco ---------- */
function tutte() { return (D.pratiche || []).concat(D.preventivi || []); }
function pronta(x) { return x.tipo === 'pratica' ? (x.ha_inverter && x.ha_modulo) : true; }
function passaFiltro(x) {
  if (stato.filtro === 'pratiche' && x.tipo !== 'pratica') return false;
  if (stato.filtro === 'preventivi' && x.tipo !== 'preventivo') return false;
  if (stato.filtro === 'pronte' && !(x.tipo === 'pratica' && pronta(x))) return false;
  if (stato.filtro === 'fv' && x.tipo === 'pratica' && !(x.kwp || x.prodotto === 'fotovoltaico')) return false;
  var q = stato.q.trim().toLowerCase();
  if (!q) return true;
  return [x.nome, x.comune, x.provincia, x.codice, x.id].join(' ').toLowerCase().indexOf(q) >= 0;
}
function disegnaElenco() {
  var tt = tutte();
  var conta = { tutte: tt.length, fv: tt.filter(function (x) { return x.tipo !== 'pratica' || x.kwp || x.prodotto === 'fotovoltaico'; }).length, pronte: (D.pratiche || []).filter(pronta).length, pratiche: (D.pratiche || []).length, preventivi: (D.preventivi || []).length };
  document.getElementById('filtri').innerHTML = [['tutte', 'Tutte'], ['fv', 'Fotovoltaico'], ['pronte', 'Pronte'], ['pratiche', 'Pratiche'], ['preventivi', 'Preventivi con layout']].map(function (f) {
    return '<button class="fl' + (stato.filtro === f[0] ? ' su' : '') + '" data-filtro="' + f[0] + '">' + f[1] + '<b>' + conta[f[0]] + '</b></button>';
  }).join('');
  var l = tt.filter(passaFiltro).sort(function (a, b) {
    var pa = pronta(a) ? 1 : 0, pb = pronta(b) ? 1 : 0;
    if (pa !== pb) return pb - pa;
    return String(b.aggiornata || '').localeCompare(String(a.aggiornata || ''));
  });
  document.getElementById('conta').textContent = l.length === tt.length ? l.length + ' in elenco' : l.length + ' su ' + tt.length;
  document.getElementById('righe').innerHTML = l.length ? l.map(rigaElenco).join('') :

    chips.push('<span class="chip ok">layout rev ' + due(x.layout_rev || 0) + (x.layout_variante === 'B' ? ' B' : '') + '</span>');
  } else {

    if (x.ha_schema) chips.push('<span class="chip p-ac">schema</span>');

    f.onload = function () { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { window.open(u, '_blank'); } setTimeout(function () { b.disabled = false; }, 800); setTimeout(function () { f.remove(); URL.revokeObjectURL(u); }, 60000); };
    document.body.appendChild(f);
  }).catch(function () { b.disabled = false; window.open(url, '_blank'); });
}

/* ---------- gestori ---------- */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-apri],[data-filtro],[data-azione],[data-conf],[data-aggiungi],[data-togli],[data-stampa]');
  if (!t) return;
  if (t.dataset.apri) { e.preventDefault(); apri(t.dataset.tipo || 'pratica', t.dataset.apri); return; }
  if (t.dataset.filtro) { stato.filtro = t.dataset.filtro; disegnaElenco(); return; }
  if (t.dataset.stampa) { stampa(t.dataset.stampa, t); return; }
  if (t.dataset.conf) { leggiConf(); stato.conf[t.dataset.conf] = t.dataset.val; document.getElementById('cardConf').innerHTML = pannelloConf(); aggiornaSomma(); return; }
  if (t.dataset.aggiungi != null) { leggiConf(); stato.conf.mppt[Number(t.dataset.aggiungi)].push({ moduli: '', ott: 'nessuno' }); document.getElementById('stringhe').innerHTML = righeMppt() + '<div class="somma" id="somma"></div>'; aggiornaSomma(); return; }
  if (t.dataset.togli) { var p = t.dataset.togli.split('-'); stato.conf.mppt[Number(p[0])].splice(Number(p[1]), 1); document.getElementById('stringhe').innerHTML = righeMppt() + '<div class="somma" id="somma"></div>'; aggiornaSomma(); return; }
  var a = t.dataset.azione;
  if (a === 'tema') { stato.tema = stato.tema === 'notte' ? 'giorno' : 'notte'; var ap = document.getElementById('app'); if (ap) ap.setAttribute('data-tema', stato.tema); try { localStorage.setItem('pg_tema', stato.tema); } catch (x) {} return; }
  if (a === 'menu') { document.getElementById('menu').classList.toggle('aperto'); return; }
  if (a === 'cima') { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (a === 'ricarica') { carica(); return; }
  if (a === 'rileggi') { leggiRevisioni(); return; }
  if (a === 'genera') { genera(t); return; }
  if (a === 'smetti') { if (S) togliAttesa(S.id); ferma(); mostraAttesa(); return; }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'aMano') { stato.conf.aMano = t.checked; document.getElementById('stringhe').classList.toggle('nascosto', !t.checked); aggiornaSomma(); return; }
  if (t.dataset && t.dataset.om != null) { stato.conf.mppt[Number(t.dataset.om)][Number(t.dataset.os)].ott = t.value; return; }
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.dataset && t.dataset.m != null) { stato.conf.mppt[Number(t.dataset.m)][Number(t.dataset.s)].moduli = t.value; aggiornaSomma(); }
});
document.addEventListener('click', function (e) { var m = document.getElementById('menu'); if (m && m.classList.contains('aperto') && !e.target.closest('#menu') && !e.target.closest('[data-azione="menu"]')) m.classList.remove('aperto'); });
document.addEventListener('visibilitychange', function () { if (!document.hidden && S && leggiAttesa(S.id)) leggiRevisioni(); });

leggiPass();
carica();
})();
</script>
